algorithm: PPO
version: AgentPolicy_v2.4_PPO
policy: MlpPolicy

hyperparameters:
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

training:
  total_timesteps: 100000
  checkpoint_freq: 10000
  eval_freq: 5000
  log_interval: 10

environment:
  observation_dim: 8
  action_space_size: 4
  initial_balance_eth: 2.0
  per_tx_limit_eth: 0.01
  daily_limit_eth: 0.05
