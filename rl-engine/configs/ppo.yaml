# PPO execution-timing policy. Changing anything here changes the model version hash.
algorithm: PPO
hyperparameters:
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 128
  n_epochs: 10
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.5
training:
  total_timesteps: 200000
  seed: 42
evaluation:
  eval_freq: 10000
  validation_episodes: 300
  test_episodes: 2000
