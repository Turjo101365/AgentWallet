algorithm: DQN
version: AgentPolicy_v1.8_DQN
policy: MlpPolicy

hyperparameters:
  learning_rate: 0.0005
  buffer_size: 50000
  learning_starts: 1000
  batch_size: 64
  tau: 1.0
  gamma: 0.99
  train_freq: 4
  gradient_steps: 1
  target_update_interval: 1000
  exploration_fraction: 0.2
  exploration_initial_eps: 1.0
  exploration_final_eps: 0.05

training:
  total_timesteps: 100000
  checkpoint_freq: 10000
  eval_freq: 5000
  log_interval: 10

environment:
  observation_dim: 8
  action_space_size: 4
  initial_balance_eth: 2.0
  per_tx_limit_eth: 0.01
  daily_limit_eth: 0.05
