# DQN execution-timing policy. Changing anything here changes the model version hash.
algorithm: DQN
hyperparameters:
  learning_rate: 0.0005
  buffer_size: 100000
  learning_starts: 2000
  batch_size: 128
  gamma: 0.995
  train_freq: 4
  gradient_steps: 1
  target_update_interval: 2000
  exploration_fraction: 0.25
  exploration_final_eps: 0.02
training:
  total_timesteps: 200000
  seed: 42
evaluation:
  eval_freq: 10000
  validation_episodes: 300
  test_episodes: 2000
