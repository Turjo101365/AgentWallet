# Local full stack: Postgres, a Hardhat chain (31337), a one-shot deployer, the RL engine,
# the backend and the static frontend. Public networks are never touched by this file.
#
#   docker compose up --build
#
# The backend executor uses Hardhat dev account #1 (derived from the public dev mnemonic via
# LOCAL_DEV_AGENT_INDEX); the backend refuses that on any non-local chain.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-agentwallet}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-agentwallet_local_only}
      POSTGRES_DB: ${DB_NAME:-agentwallet}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-agentwallet} -d ${DB_NAME:-agentwallet}"]
      interval: 5s
      timeout: 5s
      retries: 10

  chain:
    build: ./contracts
    ports:
      - "127.0.0.1:8545:8545"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='content-type: application/json' --post-data='{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_chainId\",\"params\":[]}' http://127.0.0.1:8545 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  deployer:
    build: ./contracts
    command: ["npx", "hardhat", "run", "scripts/deploy.js", "--network", "localhost"]
    environment:
      LOCAL_RPC_URL: http://chain:8545
      DEPLOYMENTS_DIR: /deployments
    volumes:
      - deployments:/deployments
    depends_on:
      chain:
        condition: service_healthy
    restart: "no"

  rl-engine:
    build: ./rl-engine
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      MODEL_DIR: /app/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      APP_ORIGIN: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      DATABASE_URL: postgresql://${DB_USER:-agentwallet}:${DB_PASSWORD:-agentwallet_local_only}@postgres:5432/${DB_NAME:-agentwallet}
      RL_SERVICE_URL: http://rl-engine:8000
      CHAIN_ID: 31337
      RPC_URL: http://chain:8545
      DEPLOYMENT_FILE: /deployments/localhost.json
      LOCAL_DEV_AGENT_INDEX: 1
    volumes:
      - deployments:/deployments:ro
    depends_on:
      postgres:
        condition: service_healthy
      rl-engine:
        condition: service_healthy
      deployer:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000/api
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  deployments:
