# Prepared free-only configuration. Provisioning and paid API calls require owner approval.
# Use a Render Hobby workspace with NO payment method; stop if card verification is required.
# Use the repository root as the build context; shared ABI, migrations and evidence are required.
services:
  - type: web
    name: agentwallet-judge-api
    runtime: node
    branch: main
    plan: free
    region: singapore
    autoDeployTrigger: "off"
    buildCommand: npm ci --prefix backend --omit=dev
    startCommand: node backend/src/server.js
    # Liveness avoids periodic SQL/RPC reads that would keep Neon compute awake.
    # /health/ready remains the full database/chain/configuration launch gate.
    healthCheckPath: /health/live
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: APP_MODE
        value: judge
      - key: CHAIN_ID
        value: "11155111"
      - key: DEPLOYMENT_FILE
        value: contracts/deployments/sepolia-v2-full.json
      - key: BACKGROUND_JOBS
        value: "false"
      - key: ALLOW_PUBLIC_TESTNET_EXECUTION
        value: "false"
      - key: TRUST_PROXY
        value: "true"
      - key: APP_ORIGIN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RPC_URL
        sync: false
      - key: DATABASE_URL
        sync: false # Neon Free direct URL with sslmode=verify-full, backend secret only
      - key: PUBLIC_AI_ENABLED
        value: "true"
      - key: JUDGE_REQUIRE_LIVE_AI
        value: "true"
      - key: PUBLIC_AI_DAILY_LIMIT
        value: "30"
      - key: LLM_PROVIDER
        value: openai-compatible
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-4.1-mini
      - key: LLM_API_KEY
        sync: false # Existing OpenAI key; never a frontend variable or committed value
      - key: LLM_TIMEOUT_MS
        value: "15000"
      - key: LOG_LEVEL
        value: info
# No Render database, disks, paid workers, extra instances, or automatic upgrades.
# Create Neon Free separately only after approval; never apply the former paid blueprint.
